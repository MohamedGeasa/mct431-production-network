name: Verify milestone 1
on: [push, pull_request, workflow_dispatch]
jobs:
  gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q
      - name: Native C protocol and state-machine tests
        run: |
          cc -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -Ifirmware/components/mct_protocol/include -Ifirmware/components/mct_node/include \
            tests/native/test_node.c firmware/components/mct_protocol/mct_protocol.c \
            firmware/components/mct_node/mct_node.c -o /tmp/test_node
          /tmp/test_node
  firmware:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.1
    strategy:
      matrix:
        station: [production, inspection]
    steps:
      - uses: actions/checkout@v4
      - name: Build classic ESP32 firmware
        shell: bash
        run: |
          . /opt/esp/idf/export.sh
          cd firmware/${{ matrix.station }}
          idf.py set-target esp32
          idf.py build
