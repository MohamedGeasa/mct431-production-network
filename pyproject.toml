[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mct431-production-network"
version = "0.1.0"
description = "MCT431 Milestone 1 production and inspection network"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "pyserial>=3.5,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
include = ["gateway*"]

[tool.setuptools.package-data]
gateway = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
